version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: threatshield-backend:local
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:delegated
    depends_on:
      - db

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: threatshield-dashboard:local
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: threatshield
      POSTGRES_PASSWORD: threatshield
      POSTGRES_DB: threatshield
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
