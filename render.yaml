# Render service configuration for ThreatShield
services:
  - type: web_service
    name: threatshield-backend
    env: docker
    plan: free
    repo: https://github.com/<your-org-or-username>/threatshield
    branch: main
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: "true"
      - key: JWT_SECRET_KEY
        sync: "true"
  - type: static_site
    name: threatshield-dashboard
    env: node
    plan: free
    repo: https://github.com/<your-org-or-username>/threatshield
    branch: main
    buildCommand: npm install && npm run build
    publishPath: dist
    rootDir: dashboard
    envVars:
      - key: VITE_API_BASE_URL
        sync: "true"
